[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    tier1: Tier 1 - Feature Coverage tests
    tier2: Tier 2 - Boundary and Corner case tests
    tier3: Tier 3 - Cross-Feature Combination tests
    tier4: Tier 4 - Real-World Application Scenario tests
    r1: Requirement 1 - Jogos vs Gols reconciliation tests
    r2: Requirement 2 - Spurious club purge and Conmebol repair tests
    r3: Requirement 3 - Player rating, Sofascore, xG, and radar tests
    r4: Requirement 4 - Storage limit, data audit, and model regression tests
