name: Scraper Diário do Futebol Brasileiro

on:
  schedule:
    # Executa todos os dias às 03:00 da manhã (horário UTC) / 00:00 (Brasília)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permissão para commitar os dados atualizados de volta no repositório

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas pillow numpy

    - name: Executar mineração de dados e clima
      run: |
        python minerar_futebol.py
        python analise_classicos_corinthians.py
        python gerar_card_tweet.py

    - name: Salvar e commitar dados atualizados no GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add *.png *.csv *.sqlite *.py || true
        git commit -m "Auto-update: Dados do Brasileirão e clima atualizados via Bot" || echo "Sem alterações para commitar"
        git push
